name: bazel bun wildcard-exports repro
on:
  workflow_dispatch: {}
  push:
    branches: [main]
jobs:
  repro:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bazel version
        run: bazel version
      - name: bazel build //:repro (toy wildcard-exports pkg via file: dependency)
        continue-on-error: true
        run: bazel build //:repro --verbose_failures --sandbox_debug
      - name: bazel build //:repro (real @effect/platform-bun via registry install)
        continue-on-error: true
        working-directory: real-pkg-variant
        run: bazel build //:repro --verbose_failures --sandbox_debug
